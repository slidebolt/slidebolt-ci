services:
  init-data:
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    restart: "no"
    command: ["sh", "-c", "mkdir -p /jenkins /docker && chown -R 1000:1000 /jenkins"]
    volumes:
      - ${CI_DATA_ROOT:-./.data}/jenkins:/jenkins
      - ${CI_DATA_ROOT:-./.data}/docker:/docker

  jenkins:
    build:
      context: .
      dockerfile: controller/Dockerfile
    restart: unless-stopped
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
      DOCKER_HOST: tcp://docker:2375
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in .env}
      SLIDEBOLT_RELEASE_REF: ${SLIDEBOLT_RELEASE_REF:-v1.0.64}
    ports:
      - ${CI_BIND_ADDRESS:-127.0.0.1}:${CI_PORT:-18080}:8080
    volumes:
      - ${CI_DATA_ROOT:-./.data}/jenkins:/var/jenkins_home
      - ./controller/casc.yaml:/var/jenkins_config/casc.yaml:ro
      - ./controller/jobs.groovy:/var/jenkins_config/jobs.groovy:ro
    depends_on:
      init-data:
        condition: service_completed_successfully
      docker:
        condition: service_healthy

  docker:
    image: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    privileged: true
    restart: unless-stopped
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ${CI_DATA_ROOT:-./.data}/docker:/var/lib/docker
      - ${CI_DATA_ROOT:-./.data}/jenkins:/var/jenkins_home
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      init-data:
        condition: service_completed_successfully

