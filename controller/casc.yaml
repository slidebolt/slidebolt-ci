jenkins:
  systemMessage: "SlideBolt standalone CI — configuration is managed by slidebolt-ci."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - file: /var/jenkins_config/jobs.groovy

